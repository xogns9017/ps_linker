    function calculateRemainingTime(lastMessageAt, categoryKey) {
      if (!lastMessageAt) return { text: '⏱️ 기한 없음', isExpired: false };
      const cat = CATEGORIES[categoryKey] || CATEGORIES.STUDY;
      const limitMs = cat.limitHours * 3600 * 1000;
      const diffMs = (lastMessageAt + limitMs) - Date.now();

      if (diffMs <= 0) return { text: '💥 폭파됨', isExpired: true };

      const hours = Math.floor(diffMs / (3600 * 1000));
      const mins = Math.floor((diffMs % (3600 * 1000)) / (60 * 1000));
      return { text: `⏱️ ${hours}시간 ${mins}분 후 폭파 예정`, isExpired: false };
    }

    function filterText(text) {
      if (!text) return { cleanText: '', isFiltered: false };
      let cleanText = text;
      let isFiltered = false;

      BAD_WORDS_BASE.forEach(bad => {
        if (text.includes(bad)) isFiltered = true;
      });

      PROFANITY_PATTERNS.forEach(pattern => {
        if (pattern.test(cleanText)) {
          isFiltered = true;
          cleanText = cleanText.replace(pattern, (match) => '*'.repeat(match.length));
        }
      });

      return { cleanText, isFiltered };
    }

          sender_email: currentUser.email,
          text: cleanText,
          image: imageToSend || null,
          timestamp: now,
          is_system: false
        };

        const { error } = await db.from('messages').insert([newMsgObj]);
        if (error) {
          triggerToast('🚨 DB 저장 실패: ' + error.message, 'danger');
        } else {
          await db.from('rooms').update({ last_message_at: now }).eq('id', activeRoomId);
        }
      };

      const handleCreateRoom = async (e) => {
        if (e) e.preventDefault();
        const titleTrimmed = newRoomTitle.trim();
        if (!titleTrimmed) return;

        const { cleanText } = filterText(titleTrimmed);
        const roomId = `room-${Date.now()}`;
        const now = Date.now();

        const newRoomLocal = {
          id: roomId,
          title: cleanText,
          category: newRoomCategory,
          creator: currentUser.nickname,
          creatorEmail: currentUser.email,
          membersCount: 1,
          lastMessageAt: now,
          createdAt: now,
          image: newRoomImage || null
        };

        const sysMsgLocal = {
          id: `m-${now}`,
          roomId: roomId,
          sender: '시스템',
          text: `🎉 '${cleanText}' 대화방이 개설되었습니다.`,
          timestamp: now,
          isSystem: true
        };

        // UI에 먼저 반영
        setRooms(prev => [newRoomLocal, ...prev]);
        setAllMessages(prev => [...prev, sysMsgLocal]);
        setNewRoomTitle('');
        setNewRoomImage(null);
        setShowCreateModal(false);
        setActiveRoomId(roomId);

        // DB에 대화방 및 메시지 추가
        const newRoomObj = {
          id: roomId,
          title: cleanText,
          category: newRoomCategory,
          creator: currentUser.nickname,
          creator_email: currentUser.email,
          members_count: 1,
          last_message_at: now,
          created_at: now,
          image: newRoomImage || null
        };

        const sysMsgObj = {
          id: `m-${now}`,
          room_id: roomId,
          sender: '시스템',
          text: `🎉 '${cleanText}' 대화방이 개설되었습니다.`,
          timestamp: now,
          is_system: true
        };

        const { error } = await db.from('rooms').insert([newRoomObj]);
        if (error) {
          triggerToast('🚨 DB 생성 실패: ' + error.message, 'danger');
        } else {
          await db.from('messages').insert([sysMsgObj]);
        }
      };

      const handleInsertMathSymbol = (sym) => {
        setChatInputText(prev => prev + (prev ? ' ' : '') + sym);
      };

      const currentRoomMessages = useMemo(() => {
        if (!activeRoomId) return [];
        return allMessages.filter(m => m.roomId === activeRoomId).sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
      }, [allMessages, activeRoomId]);

      const filteredRooms = useMemo(() => {
        return rooms.filter(room => {
          if (selectedCategory !== 'ALL' && room.category !== selectedCategory) return false;
          if (searchQuery.trim() && !room.title.toLowerCase().includes(searchQuery.toLowerCase())) return false;
          return true;
        });
      }, [rooms, selectedCategory, searchQuery]);

      const activeRoom = rooms.find(r => r.id === activeRoomId);

      // LOGIN SCREEN
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-slate-900 text-slate-800 flex justify-center items-center font-sans antialiased p-4">
            <div className="w-full max-w-md bg-white rounded-3xl p-6 shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="w-16 h-16 bg-teal-600 text-white rounded-2xl flex items-center justify-center mx-auto shadow-lg">
                  <HeartHandshake className="w-9 h-9" />
                </div>
                <h1 className="text-2xl font-black text-slate-900">풍생 링커</h1>
                <p className="text-xs text-teal-700 font-bold">Poongsaeng High School Linker</p>
              </div>

              <div className="space-y-4">
                <button 
                  onClick={() => { setIsLoggedIn(true); setActiveTab('home'); }}
                  className="w-full py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-extrabold rounded-2xl text-xs shadow-lg transition"
                >
                  🚀 로그인하고 입장하기
                </button>
              </div>
            </div>
          </div>
        );
      }

      // MAIN APP SCREEN
      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 flex justify-center font-sans antialiased">
          <div className="w-full max-w-md bg-white min-h-screen flex flex-col shadow-2xl relative pb-24 border-x border-slate-200">
            
            {toastMessage && (
              <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full shadow-xl text-xs font-bold flex items-center gap-2 ${
                toastMessage.type === 'success' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-white'
              }`}>
                <Sparkles className="w-4 h-4" />
                <span>{toastMessage.text}</span>
              </div>
            )}

            {!activeRoomId && (
              <header className="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200 p-4 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <div className="w-9 h-9 bg-teal-600 rounded-xl flex items-center justify-center text-white shadow-md">
                    <HeartHandshake className="w-5 h-5" />
                  </div>
                  <div>
                    <h1 className="font-black text-base text-slate-900 leading-none">풍생 링커</h1>
                    <p className="text-[10px] text-teal-700 font-bold mt-0.5">Poongsaeng Anonymous Platform</p>
                  </div>
                </div>
              </header>
            )}

            {/* CHAT ROOM VIEW */}
            {activeRoomId ? (
              <div className="flex-1 flex flex-col bg-slate-50 relative h-screen">
                <div className="bg-white border-b border-slate-200 p-3 flex items-center justify-between sticky top-0 z-20 shadow-sm">
                  <div className="flex items-center gap-2">
                    <button onClick={() => setActiveRoomId(null)} className="p-1 text-slate-500 hover:text-slate-800">
                      <X className="w-5 h-5" />
                    </button>
                    <div>
                      <h2 className="font-bold text-xs text-slate-900 truncate max-w-[180px]">{activeRoom?.title || '대화방'}</h2>
                    </div>
                  </div>
                </div>

                <div className="flex-1 p-4 overflow-y-auto space-y-3 ios-scroll">
                  {currentRoomMessages.map((msg) => {
                    const isMe = msg.sender === currentUser.nickname;
                    if (msg.isSystem) {
                      return (
                        <div key={msg.id} className="text-center my-2">
                          <span className="text-[10px] bg-teal-50 text-teal-800 border border-teal-200 px-3 py-1 rounded-full font-bold">
                            {msg.text}
                          </span>
                        </div>
                      );
                    }

                    return (
                      <div key={msg.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                        <div className="text-[10px] text-slate-400 mb-0.5">{msg.sender}</div>
                        <div className={`max-w-[80%] rounded-2xl p-3 text-xs shadow-sm ${isMe ? 'bg-teal-600 text-white' : 'bg-white text-slate-800 border'}`}>
                          {msg.text}
                        </div>
                      </div>
                    );
                  })}
                  <div ref={messagesEndRef} />
                </div>

                {showMathKeyboard && (
                  <div className="bg-slate-100 border-t border-slate-200 p-2 space-y-2">
                    <div className="grid grid-cols-5 gap-1.5">
                      {MATH_SYMBOL_CATEGORIES[selectedMathCategory].symbols.map((sym, idx) => (
                        <button key={idx} onClick={() => handleInsertMathSymbol(sym)} className="bg-white border text-slate-800 font-mono text-xs py-1.5 rounded-lg font-bold">
                          {sym}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                <div className="bg-white border-t border-slate-200 p-3">
                  <form onSubmit={handleSendMessage} className="flex items-center gap-2">
                    <button type="button" onClick={() => setShowMathKeyboard(!showMathKeyboard)} className="p-2 bg-amber-100 text-amber-800 rounded-xl">
                      <Calculator className="w-4 h-4" />
                    </button>
                    <input 
                      type="text" 
                      value={chatInputText}
                      onChange={(e) => setChatInputText(e.target.value)}
                      placeholder="메시지 입력..." 
                      className="flex-1 bg-slate-100 border rounded-xl px-3 py-2 text-xs"
                    />
                    <button type="submit" className="p-2 bg-teal-600 text-white rounded-xl">
                      <Send className="w-4 h-4" />
                    </button>
                  </form>
                </div>
              </div>
            ) : (
              /* TAB CONTENTS */
              <div className="flex-1 p-4 space-y-5 overflow-y-auto ios-scroll">
                {activeTab === 'home' && (
                  <div className="space-y-4">
                    <div className="bg-gradient-to-br from-teal-700 to-emerald-800 rounded-3xl p-5 text-white shadow-xl space-y-3">
                      <h2 className="text-lg font-black">실시간 온라인 데이터베이스 연결 완료!</h2>
                      <p className="text-xs text-teal-100">이제 다른 사용자와 실시간으로 소통할 수 있습니다.</p>
                      <button onClick={() => setShowCreateModal(true)} className="px-3 py-2 bg-white text-teal-900 font-extrabold rounded-xl text-xs flex items-center gap-1 shadow">
                        <Plus className="w-4 h-4" />
                        <span>방 만들기</span>
                      </button>
                    </div>

                    <div className="space-y-2">
                      <h3 className="font-extrabold text-sm text-slate-900">실시간 활성 대화방</h3>
                      {filteredRooms.map(room => (
                        <div key={room.id} onClick={() => setActiveRoomId(room.id)} className="p-3.5 bg-white rounded-2xl border hover:border-teal-500 shadow-sm cursor-pointer">
                          <h4 className="font-extrabold text-xs text-slate-900">{room.title}</h4>
                          <p className="text-[10px] text-slate-400 mt-1">개설자: {room.creator}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* NAVIGATION */}
            {!activeRoomId && (
              <nav className="fixed bottom-3 left-1/2 -translate-x-1/2 w-[calc(100%-1.5rem)] max-w-md bg-white/95 border rounded-2xl py-2.5 px-3 flex items-center justify-around z-30 shadow-2xl">
                <button onClick={() => setActiveTab('home')} className="flex flex-col items-center gap-0.5 text-[10px] font-bold text-teal-600"><Home className="w-5 h-5" /><span>홈</span></button>
              </nav>
            )}

            {/* MODAL: CREATE ROOM */}
            {showCreateModal && (
              <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
                  <div className="flex items-center justify-between border-b pb-2">
                    <h3 className="font-extrabold text-base text-slate-900">새 대화방 개설</h3>
                    <button onClick={() => setShowCreateModal(false)} className="text-slate-400"><X className="w-5 h-5" /></button>
                  </div>
                  <form onSubmit={handleCreateRoom} className="space-y-3 text-xs">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">제목</label>
                      <input type="text" value={newRoomTitle} onChange={(e) => setNewRoomTitle(e.target.value)} placeholder="대화방 제목 입력" className="w-full bg-slate-50 border rounded-xl p-2.5 text-xs" required />
                    </div>
                    <button type="submit" className="w-full py-3 bg-teal-600 text-white font-extrabold rounded-xl text-xs shadow">대화방 개설하기</button>
                  </form>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
